<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DoodleMagic — звук</title>
    <style>
      body { font: 15px/1.4 system-ui, sans-serif; margin: 16px; background: #f4efe4; color: #222; }
      h1 { font-size: 20px; margin: 0 0 12px; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
      button { font: inherit; padding: 4px 10px; border: 1px solid #555; border-radius: 4px; background: #fff; cursor: pointer; }
      button:hover { background: #ffe9c7; }
      button.all { border-style: dashed; }
      label { margin-right: 8px; }
      .status { color: #666; margin-left: 8px; }
      table { border-collapse: collapse; margin-top: 8px; }
      th, td { border: 1px solid #bbb; padding: 2px 8px; text-align: right; }
      td:first-child { text-align: left; }
      tr.fire td:first-child { color: #c4421a; }
      tr.earth td:first-child { color: #3d6b4a; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module">
      import { mountAudition } from "./audition.ts";
      mountAudition(document.getElementById("app"));
    </script>
  </body>
</html>
